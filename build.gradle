plugins {
    id 'idea'
}

ext.minecraftRunDirectory = { String name -> rootProject.file("run/${name}") }

allprojects {
    group = mod_group_id
    version = "${mod_version}+${mc_version}"

    repositories {
        mavenLocal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.parchmentmc.org' }
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'

    java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = java_version as int
    }
}
