plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

base {
    archivesName = "${mod_id}-neoforge-${mc_version}"
}

def runDirectory = rootProject.ext.minecraftRunDirectory

sourceSets {
    main {
        java {
            srcDir rootProject.file('src/main/java')
        }
        resources {
            srcDir rootProject.file('src/main/resources')
        }
    }
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = neoforge_parchment_minecraft_version
        mappingsVersion = neoforge_parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = runDirectory('neoforge-client')
        }

        server {
            server()
            gameDirectory = runDirectory('neoforge-server')
            programArgument '--nogui'
        }

        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

def neoforgeResourceProperties = [
        minecraft_version      : neoforge_minecraft_version,
        minecraft_version_range: neoforge_minecraft_version_range,
        neo_version            : neoforge_version,
        loader_version_range   : neoforge_loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : project.version
]

processResources {
    inputs.properties neoforgeResourceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand neoforgeResourceProperties
    }
}
